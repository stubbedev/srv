name: e2e

# End-to-end tests boot a real Traefik via compose and route real HTTP through
# it. They need a container engine + mkcert + free ports 80/443/88/8080, so they
# run in their own workflow (not the main `test` job) on a clean ubuntu-latest
# runner. Gated behind the `e2e` build tag, one leg per engine.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # One leg per container engine. The harness skips cleanly when its engine
    # is absent or its API is unreachable, so a leg never fails for being on
    # the wrong box — it just reports skipped.
    name: e2e (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      SRV_CONTAINER_ENGINE: ${{ matrix.engine }}
      # The podman leg targets the *rootful* socket, which is the deliverable;
      # rootless needs a sysctl for the privileged ports Traefik binds and is
      # tracked separately. Naming the endpoint outright is srv's documented
      # escape hatch and removes any ambiguity about which podman is meant —
      # the runner also carries a rootless socket path.
      DOCKER_HOST: ${{ matrix.engine == 'podman' && 'unix:///run/podman/podman.sock' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # mkcert as a prebuilt binary. `srv proxy add` shells out to it to
      # issue a local cert; cert generation auto-creates the local CA on
      # first use, so no `mkcert -install` (system trust) is needed — the
      # e2e HTTP client skips TLS verification.
      - name: Install mkcert
        run: |
          set -euo pipefail
          curl -fsSL -o mkcert \
            "https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64"
          chmod +x mkcert
          sudo mv mkcert /usr/local/bin/mkcert
          mkcert -version

      # Rootful podman with its Docker-compatible API socket enabled, which is
      # what the deliverable targets. Compose v2 is what writes the
      # com.docker.compose.* labels srv filters on, so it is installed as
      # podman's compose provider rather than podman-compose.
      - name: Install podman + Compose v2
        if: matrix.engine == 'podman'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman docker-compose-v2
          sudo systemctl enable --now podman.socket
          # The suite runs as the runner user against the rootful socket. Both
          # the directory and the socket need opening: /run/podman is 0700
          # root:root, so the socket's own mode is irrelevant until the user
          # can traverse into it. A throwaway CI box is the one place doing
          # this is reasonable; rootless podman needs a sysctl for the
          # privileged ports Traefik binds and is tracked separately.
          sudo chmod 0755 /run/podman
          sudo chmod 0666 /run/podman/podman.sock
          ls -ld /run/podman /run/podman/podman.sock
          # Fail here rather than inside a test if the socket is not actually
          # serving: this is the whole premise of the leg.
          podman --remote --url unix:///run/podman/podman.sock info >/dev/null
          podman compose version

      - name: Run e2e tests
        run: go test -tags=e2e -v ./e2e/... -timeout 30m
