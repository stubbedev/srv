name: e2e

# End-to-end tests boot a real Traefik, route real HTTP through it, and install
# daemon service units in a throwaway systemd container. e2e/run.sh runs the
# test process itself inside the Dockerfile.dev image, never on the runner;
# it drives the runner's engine through its socket and needs free ports
# 80/443/88/8080, so the suite has its own workflow on a clean ubuntu-latest
# runner. Gated behind the `e2e` build tag, one leg per engine.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # One leg per container engine. The harness skips cleanly when its engine
    # is absent or its API is unreachable, so a leg never fails for being on
    # the wrong box — it just reports skipped.
    name: e2e (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # e2e/run.sh keeps the Go module and build caches under .e2e/.
      - uses: actions/cache@v6
        with:
          path: |
            .e2e/gomod
            .e2e/gocache
          key: e2e-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: e2e-go-${{ runner.os }}-

      # Rootful podman with its Docker-compatible API socket enabled, which is
      # what the deliverable targets. The podman client and Compose v2 run
      # inside the test image; the runner only serves the socket.
      - name: Install podman
        if: matrix.engine == 'podman'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          sudo systemctl enable --now podman.socket
          # The suite runs as the runner user against the rootful socket. Both
          # the directory and the socket need opening: /run/podman is 0700
          # root:root, so the socket's own mode is irrelevant until the user
          # can traverse into it. A throwaway CI box is the one place doing
          # this is reasonable; rootless podman needs a sysctl for the
          # privileged ports Traefik binds and is tracked separately.
          sudo chmod 0755 /run/podman
          sudo chmod 0666 /run/podman/podman.sock
          ls -ld /run/podman /run/podman/podman.sock
          # Fail here rather than inside a test if the socket is not actually
          # serving: this is the whole premise of the leg.
          podman --remote --url unix:///run/podman/podman.sock info >/dev/null

      - name: Run e2e tests
        run: e2e/run.sh ${{ matrix.engine }}
