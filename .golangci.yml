version: "2"

# Two jobs, one file.
#
#  1. Correctness gate — errcheck/govet/staticcheck/nilerr/… catch bugs.
#  2. Modernization gate — every linter that knows a newer/faster way to write
#     something Go already does: modernize, intrange, perfsprint, exptostd,
#     mirror, usestdlibvars. These all auto-fix, so a finding is applied by
#     `just lint-fix`, never argued about.
#
# Deliberately absent, with the count that decided it: goconst (269 — repeated
# strings in table tests), godoclint (49), exhaustive (17 — srv's "enums" are
# plain string consts, so every switch reads as non-exhaustive), nilnil (9),
# embeddedstructfieldcheck (10), contextcheck (8 — it wants the leaf helpers
# that deliberately carry no deadline to inherit one), and wsl/nlreturn/lll/
# mnd/varnamelen/exhaustruct, which fire in the thousands. Style opinions that
# bury the gates above are worse than no linter.

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # ── correctness ──────────────────────────────────────────────────────
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint # auto-fix
    - errname
    - gocheckcompilerdirectives
    - gocritic # auto-fix
    - govet # auto-fix
    - ineffassign
    - makezero
    - nilerr
    - nilnesserr
    - noctx
    - predeclared
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - staticcheck # auto-fix
    - unconvert
    - unused
    - wastedassign

    # ── modernization / performance (all auto-fix) ───────────────────────
    - copyloopvar # the pre-1.22 `x := x` loop dance
    - exptostd # golang.org/x/exp/… that has landed in the stdlib
    - fatcontext # context re-derived inside a loop
    - intrange # for i := 0; i < n; i++  →  for i := range n
    - mirror # the bytes/strings twin that avoids a conversion
    - modernize # slices/maps/min/max/range-over-func/WaitGroup.Go/…
    - perfsprint # fmt.Sprintf where strconv or concatenation does
    - prealloc
    - usestdlibvars # http.MethodGet, http.StatusOK, time.RFC3339, …
    - usetesting # t.TempDir/t.Setenv/t.Context over the manual dance

    # ── hygiene ──────────────────────────────────────────────────────────
    - canonicalheader
    - dupword # auto-fix
    - errchkjson
    - forcetypeassert
    - funcorder
    - godot # auto-fix
    - iotamixing
    - misspell # auto-fix
    - nolintlint # auto-fix
    - revive # auto-fix
    - tagalign # auto-fix
    - unparam
    - whitespace # auto-fix

    # ── security ─────────────────────────────────────────────────────────
    # srv writes config files, builds paths from user input and shells out to
    # a container engine, so the rules below are load-bearing. Four of gosec's
    # rules are policy decisions for a local-dev CLI rather than findings, and
    # are switched off by ID in settings rather than papered over one call site
    # at a time.
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Setenv
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    gosec:
      excludes:
        # G306: srv writes configs at 0644 on purpose (constants.FilePermDefault).
        # They are not secrets — Traefik reads several from inside a container,
        # and a 0600 config in ~/.config/srv would be a usability bug, not a fix.
        - G306
        # G703/G304: every path srv touches is one the invoking user gave it —
        # SRV_ROOT, XDG_CONFIG_HOME, a site directory. It is their own CLI
        # running as them; there is no privilege boundary to traverse.
        - G703
        - G304
        # G204: shelling out to the container engine *is* the program. The
        # binary comes from engine's fixed table and the args are srv-built;
        # see internal/engine for why the binary is never free-form.
        - G204
    perfsprint:
      # Concatenation over Sprintf for the two-operand case as well — this is
      # the single biggest win the linter has, and it reads fine.
      strconcat: true
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
          disabled: true
        - name: var-declaration
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - commentFormatting

  exclusions:
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # SEP-2577 deprecates MCP roots, sampling and logging as of protocol
      # 2026-07-28, but they stay functional for at least twelve months and are
      # still how current clients hand this server its workspace. Scoped to that
      # SEP's URL so every other deprecation still fails the gate. Delete this
      # rule, and the paths it covers, once the window closes.
      - linters:
          - staticcheck
        text: "SA1019.*seps/2577-deprecate-roots-sampling-and-logging"
      - path: _test\.go
        linters:
          - errcheck
          - forcetypeassert # map[string]any navigation is the point of a fixture
          - gocritic
          - gosec
          - noctx
          - prealloc
          - unparam # helpers legitimately take args one caller does not vary
      - path: third_party/
        linters:
          - bodyclose
          - durationcheck
          - errcheck
          - errname
          - errorlint
          - gocritic
          - govet
          - ineffassign
          - makezero
          - misspell
          - modernize
          - nilerr
          - noctx
          - perfsprint
          - prealloc
          - revive
          - staticcheck
          - unconvert
          - unused
          - whitespace

formatters:
  # gofumpt is gofmt plus the rules gofmt left on the table; its output is still
  # gofmt-stable, so CI's `gofmt -l` check keeps passing.
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
