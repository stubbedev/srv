# Dev/test environments. The `dev` profile keeps the suite off the host so
# nothing a test execs (sudo steps, trust stores, resolv.conf probes) can
# ever reach the developer's terminal.
#
#   docker compose --profile dev up -d --build
#   docker compose --profile dev exec dev go test ./...
#   docker compose --profile dev down
services:
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: srv-dev
    container_name: srv-dev
    command: sleep infinity
    volumes:
      - .:/work
      # Share the host module cache; uid 1000 in the container matches the
      # host login that owns it, so writes stay consistent both ways.
      - ${HOME}/go/pkg/mod:/go/pkg/mod
      - srv-gocache:/gocache
      # Drive the host engine from inside the container. The e2e suite does
      # not run here: e2e/run.sh starts it with host networking and path
      # parity, which this service lacks.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GOCACHE: /gocache

volumes:
  srv-gocache:
