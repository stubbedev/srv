site_name: srv
site_description: Traefik, TLS and DNS for every site on your machine.
site_url: https://stubbedev.github.io/srv/
repo_url: https://github.com/stubbedev/srv
repo_name: stubbedev/srv
edit_uri: edit/master/docs/
copyright: MIT licensed

strict: true
exclude_docs: |
  proposals/
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Sites: sites.md
      - Routing: routing.md
      - Host services: host-services.md
      - Container runtimes: container-runtimes.md
      - Configuration: configuration.md
      - Daemon: daemon.md
      - How it works: how-it-works.md
      - AI integration (MCP): mcp.md
      - Importing from Valet: import-valet.md
      - Metrics: metrics.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - CLI: cli.md
      - Config files: config-reference.md
      - MCP tools: mcp-tools.md
